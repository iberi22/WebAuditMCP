name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        # The repo has npm workspaces (root package.json) and no lockfile,
        # so a plain install (not `npm ci`) from the root is used. npm hoists
        # the node-tools deps to the root node_modules. These provide the
        # pinned `playwright`, `lighthouse` and `hint` binaries the Python
        # tools shell out to.
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        # Installs Chromium plus the OS libraries headless Chrome needs.
        working-directory: node-tools
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        run: |
          python -m pytest tests/ -q

      - name: Check Node.js tools syntax
        run: |
          node --check node-tools/axe-playwright.js
          node --check node-tools/responsive.js
          node --check node-tools/security-headers.js
